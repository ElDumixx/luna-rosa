# Publishes the PWA on GitHub Pages every time you push to the main branch (or by hand from the Actions tab).
# Repository → Settings → Pages → Source: "GitHub Actions". Address: https://<user>.github.io/<repository>/
name: Publicar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # served from /<repository>/, except a <user>.github.io repository, which is served from the root
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export EXPO_BASE_URL=""; else export EXPO_BASE_URL="/$REPO"; fi
          npm run build:pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
